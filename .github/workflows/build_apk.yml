name: Build Android APK (Wilderness 3D Survival RPG)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              git \
              python3-pip \
              openjdk-17-jdk \
              autoconf \
              libtool \
              pkg-config \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libtinfo5 \
              cmake \
              libffi-dev \
              libssl-dev \
              ccache

      - name: Upgrade pip and install buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade Cython==0.29.36 buildozer

      - name: Build with Buildozer
        run: buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: bin/*.apk
